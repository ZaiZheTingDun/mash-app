[tool.poetry]
name = "mash-cv"
version = "0.1.0"
description = "OpenCV-based screen detection sidecar for mash"
authors = []
readme = "README.md"
packages = [{ include = "mash_cv" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
opencv-python-headless = "*"
numpy = "*"
av = "*"
rapidocr-onnxruntime = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"
# 6.15+ is required for Python 3.13 support and ships modern pkg_resources
# shims, so the build script no longer has to `pip install` setuptools/
# pyinstaller out-of-band on top of poetry.
pyinstaller = "^6.15"

[tool.poetry.scripts]
run = "mash_cv:main"
region = "mash_cv.region_tool:main"
unit = "mash_cv.run_tests:unit"
integration = "mash_cv.run_tests:integration"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
