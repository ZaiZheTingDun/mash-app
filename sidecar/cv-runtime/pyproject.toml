[tool.poetry]
name = "mash-cv"
version = "0.1.0"
description = "Native dependencies and packaging tools for Mash CV"
authors = []
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
opencv-python-headless = "*"
numpy = "*"
av = "*"
rapidocr-onnxruntime = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"
# 6.15+ is required for Python 3.13 support and ships modern pkg_resources
# shims, so the build script no longer has to `pip install` setuptools/
# pyinstaller out-of-band on top of poetry.
pyinstaller = "^6.15"

[tool.pytest.ini_options]
testpaths = ["../cv-code/tests", "tests"]
pythonpath = ["../cv-code"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
