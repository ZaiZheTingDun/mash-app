name: CV code release
run-name: CV code release v${{ inputs.code_version }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Reviewed source ref on the default branch (resolved to a commit SHA)
        type: string
        required: true
        default: main
      code_version:
        description: New shared CV code version (x.y.z)
        type: string
        required: true
      publish:
        description: Upload verified code, create its tag, and open a manifest PR
        type: boolean
        default: false

permissions:
  contents: read

# Serializes this publisher through upload, tag creation and the manifest PR.
concurrency:
  group: cv-code-release
  cancel-in-progress: false

env:
  RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL || 'https://mash.xiaotongx.com' }}
  R2_PREFIX: ${{ vars.R2_PREFIX || 'mash' }}
  POETRY_VIRTUALENVS_IN_PROJECT: 'true'

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Require release tooling from the default branch
        env:
          WORKFLOW_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$WORKFLOW_REF" = "refs/heads/$DEFAULT_BRANCH"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve reviewed source and published runtime dependencies
        id: plan
        env:
          CODE_VERSION: ${{ inputs.code_version }}
          SOURCE_REF: ${{ inputs.source_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/shared/cv-code-release.mjs plan "$CODE_VERSION" "$SOURCE_REF" "$DEFAULT_BRANCH" plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: cv-code-plan
          path: plan.json
          if-no-files-found: error
          retention-days: 30

  build:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: cv-code-plan
          path: candidate
      - name: Build the shared code ZIP once
        working-directory: source/sidecar/mash_cv
        env:
          MASH_CV_CODE_VERSION: ${{ needs.plan.outputs.version }}
        run: python build_sidecar.py --code-only
      - name: Record source, artifact hash and pinned runtimes
        working-directory: source
        env:
          CODE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          node "$GITHUB_WORKSPACE/tooling/scripts/shared/cv-code-release.mjs" record \
            "$GITHUB_WORKSPACE/candidate/plan.json" \
            "sidecar/mash_cv/dist/mash-cv-code-v$CODE_VERSION.zip" "$GITHUB_WORKSPACE/candidate"
      - uses: actions/upload-artifact@v4
        with:
          name: cv-code-candidate
          path: |
            candidate/*.zip
            candidate/release.json
          if-no-files-found: error
          retention-days: 30

  compatibility:
    name: Published runtime compatibility (${{ matrix.platform }})
    needs: [plan, build]
    environment: cv-code-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x86_64
          - os: macos-15
            platform: darwin-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: cv-code-candidate
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked source-test dependencies
        working-directory: source/sidecar/mash_cv
        run: |
          python -m pip install poetry==2.2.1
          poetry install --no-root
      - name: Source CV tests
        working-directory: source/sidecar/mash_cv
        run: poetry run pytest --ignore=tests/test_windows_runtime.py
      - name: Download the pinned runtime via R2 API and exercise the packaged code
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'mash' }}
        run: |
          python tooling/sidecar/mash_cv/verify_code_release.py candidate/release.json \
            --dist source/sidecar/mash_cv/dist --report "reports/$TARGET_PLATFORM.json"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/src-tauri -> target
          shared-key: cv-code-release-${{ runner.os }}-${{ runner.arch }}
      - name: Validate candidate ZIP installation through Rust
        working-directory: source
        run: |
          node ../tooling/scripts/shared/cv-code-release.mjs apply ../candidate/release.json
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib tests::locally_built_platform_bundles_install_and_report_ready -- --ignored --exact
      - uses: actions/upload-artifact@v4
        with:
          name: cv-code-tested-${{ matrix.platform }}
          path: reports/*.json
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [plan, build, compatibility]
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: cv-code-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: cv-code-candidate
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          pattern: cv-code-tested-*
          path: reports
          merge-multiple: true
      - name: Upload immutable artifacts and verify R2 API downloads
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'mash' }}
        run: node scripts/shared/cv-code-release.mjs publish candidate/release.json reports
      - name: Create or verify the source tag after publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          node scripts/shared/cv-code-release.mjs tag candidate/release.json

  manifest-pr:
    needs: [plan, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: cv-code-candidate
          path: candidate
      - name: Update code references and create or reuse the release PR
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          CODE_VERSION: ${{ needs.plan.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          helper="$GITHUB_WORKSPACE/tooling/scripts/shared/cv-code-release.mjs"
          receipt="$GITHUB_WORKSPACE/candidate/release.json"
          branch="feat/cv-code-$CODE_VERSION"
          node "$helper" validate-apply "$receipt"
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            git switch -c "$branch" "origin/$branch"
          else
            git switch -c "$branch"
          fi
          node "$helper" apply "$receipt"
          git add -- versions.toml src-tauri/resources/runtime-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): apply mash-cv code $CODE_VERSION"
            git push --set-upstream origin "$branch"
          fi
          node "$helper" pr-body "$receipt" "$RUNNER_TEMP/cv-code-pr.md"
          existing=$(gh pr list --head "$branch" --base "$DEFAULT_BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -n "$existing" ]; then
            echo "$existing" >> "$GITHUB_STEP_SUMMARY"
          elif ! git diff --quiet "origin/$DEFAULT_BRANCH" HEAD -- versions.toml src-tauri/resources/runtime-manifest.json; then
            gh pr create --base "$DEFAULT_BRANCH" --head "$branch" \
              --title "chore(release): apply mash-cv code $CODE_VERSION" \
              --body-file "$RUNNER_TEMP/cv-code-pr.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The default branch already references this CV code release.' >> "$GITHUB_STEP_SUMMARY"
          fi
