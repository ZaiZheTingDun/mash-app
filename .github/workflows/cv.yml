name: CV tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POETRY_VIRTUALENVS_IN_PROJECT: 'true'

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      cv: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || steps.filter.outputs.cv == 'true' || steps.filter.outputs.unknown == 'true' }}
      cvBuild: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || steps.filter.outputs.cvBuild == 'true' || steps.filter.outputs.unknown == 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        with:
          # Same-branch pushes compare the event's before/after commits; PRs use the files API.
          base: ${{ github.event_name == 'push' && github.ref_name || '' }}
          predicate-quantifier: some-with-excludes
          filters: |
            cv:
              - 'sidecar/cv-code/**'
              - 'sidecar/cv-runtime/**'
              - 'src-tauri/src/screen.rs'
              - 'src-tauri/src/screen/**'
              - 'src-tauri/resources/scrcpy/**'
              - 'src-tauri/resources/runtime-manifest.json'
              - 'scripts/{macos,windows}/build-cv.{sh,ps1}'
              - 'src-tauri/build_support.rs'
              - 'src-tauri/build.rs'
              - 'scripts/windows/common.ps1'
              - '.github/workflows/cv.yml'
              - 'src-tauri/src/commands/**'
              - 'src-tauri/src/lib.rs'
              - 'src/types/**'
              - 'src-tauri/resources/servers/**'
              - '!**/*.md'
              - '!**/{LICENSE,NOTICE}{,.*}'
            cvBuild:
              - 'sidecar/cv-runtime/**'
              - 'scripts/{macos,windows}/build-cv.{sh,ps1}'
              - 'scripts/windows/common.ps1'
              - '.github/workflows/cv.yml'
              - '!**/*.md'
              - '!**/{LICENSE,NOTICE}{,.*}'
            unknown:
              - '**'
              - '!src/**'
              - '!public/**'
              - '!src-tauri/**'
              - '!sidecar/{cv-code,cv-runtime}/**'
              - '!scripts/**'
              - '!docs/**'
              - '!**/*.md'
              - '!**/{LICENSE,NOTICE}{,.*}'
              - '!{index.html,package.json,pnpm-lock.yaml,pnpm-workspace.yaml,.npmrc}'
              - '!{vite,vitest,eslint}.config.*'
              - '!tsconfig*.json'
              - '!.codex/skills/**'
              - '!.github/workflows/{frontend,rust,cv}.yml'

  test:
    name: CV pytest (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.cv == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sidecar/cv-runtime/poetry.lock
      - name: Install Poetry
        shell: bash
        run: python -m pip install poetry==2.2.1
      - uses: actions/cache@v4
        with:
          path: sidecar/cv-runtime/.venv
          key: cv-venv-v1-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-poetry2.2.1-${{ hashFiles('sidecar/cv-runtime/poetry.lock', 'sidecar/cv-runtime/pyproject.toml') }}
      - name: Install CV dependencies
        shell: bash
        working-directory: sidecar/cv-runtime
        run: poetry install --no-root
      - name: Source CV tests
        shell: bash
        working-directory: sidecar/cv-runtime
        run: poetry run pytest --ignore=tests/test_windows_runtime.py

  runtime:
    name: Windows CV package and integration
    needs: [changes, test]
    if: needs.changes.outputs.cvBuild == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sidecar/cv-runtime/poetry.lock
      - name: Install Poetry
        shell: bash
        run: python -m pip install poetry==2.2.1
      - uses: actions/cache@v4
        with:
          path: sidecar/cv-runtime/.venv
          key: cv-venv-v1-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-poetry2.2.1-${{ hashFiles('sidecar/cv-runtime/poetry.lock', 'sidecar/cv-runtime/pyproject.toml') }}
      - name: Install CV dependencies
        shell: bash
        working-directory: sidecar/cv-runtime
        run: poetry install --no-root
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: native-tests-${{ runner.os }}-${{ runner.arch }}
      - name: Build Windows CV artifacts
        run: |
          ./scripts/windows/build-cv.ps1 -SkipInstall
          if (-not (Test-Path -LiteralPath 'sidecar/cv-runtime/dist/mash-cv-runtime/mash-cv.exe' -PathType Leaf)) {
            throw 'The CV build did not produce mash-cv.exe.'
          }
      - name: Frozen runtime smoke tests
        working-directory: sidecar/cv-runtime
        run: poetry run pytest tests/test_windows_runtime.py
      - name: Prepare Windows ADB resources
        run: ./scripts/windows/prepare-windows-adb.ps1
      - name: Install locally built CV ZIPs through the Rust backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib tests::locally_built_platform_bundles_install_and_report_ready -- --ignored --exact
      - uses: actions/upload-artifact@v4
        with:
          name: mash-cv-windows-x64
          path: |
            sidecar/cv-code/dist/*.zip
            sidecar/cv-runtime/dist/*.zip
          if-no-files-found: error

  result:
    name: CV result
    if: always()
    needs: [changes, test, runtime]
    runs-on: ubuntu-latest
    steps:
      - name: Check selected jobs
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          TEST_RESULT: ${{ needs.test.result }}
          TEST_EXPECTED: ${{ needs.changes.outputs.cv == 'true' && 'success' || 'skipped' }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          RUNTIME_EXPECTED: ${{ needs.changes.outputs.cvBuild == 'true' && 'success' || 'skipped' }}
        run: |
          set -x
          test "$CHANGES_RESULT" = success
          test "$TEST_RESULT" = "$TEST_EXPECTED"
          test "$RUNTIME_RESULT" = "$RUNTIME_EXPECTED"
