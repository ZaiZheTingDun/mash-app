name: Release CV Code

on:
  push:
    tags:
      - "cv-code/*"

permissions:
  contents: read

jobs:
  release-cv-code:
    name: Release mash-cv code
    runs-on: macos-15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      RELEASE_BASE_URL: ${{ secrets.RELEASE_BASE_URL }}
      R2_PREFIX: mash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install AWS CLI
        run: brew install awscli

      - name: Publish CV code release to R2
        id: release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          CODE_VERSION="${TAG#cv-code/}"
          if [[ -z "$CODE_VERSION" || "$CODE_VERSION" == "$TAG" ]]; then
            echo "Unexpected tag: $TAG" >&2
            exit 1
          fi
          if [[ ! "$CODE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)*$ ]]; then
            echo "CV code tag must look like cv-code/x.y.z; got $TAG" >&2
            exit 1
          fi

          AWS_PROFILE="" scripts/release-mash-cv-code.sh "$CODE_VERSION"

      - name: Write summary
        run: |
          {
            echo "## mash-cv code release"
            echo ""
            echo "- Version: \`${{ steps.release.outputs.code_version }}\`"
            echo "- Artifact: \`${{ steps.release.outputs.artifact }}\`"
            echo "- URL: ${{ steps.release.outputs.url }}"
            echo "- SHA-256: \`${{ steps.release.outputs.sha256 }}\`"
            echo ""
            echo "Update \`src-tauri/resources/runtime-manifest.json\` with:"
            echo ""
            echo "\`\`\`json"
            echo "\"codeUrl\": \"${{ steps.release.outputs.url }}\","
            echo "\"codeSha256\": \"${{ steps.release.outputs.sha256 }}\""
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
